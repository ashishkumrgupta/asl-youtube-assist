<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASL assist · local demos</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <p class="eyebrow">Local fixtures · no YouTube</p>
        <h1 id="page-title">ASL assist / partial</h1>
        <p class="lede">
          Caption → gloss sync only. Pack pending — not signing video, not an interpreter.
        </p>
      </header>

      <section class="player" aria-label="Demo video">
        <video
          id="asl-demo-video"
          data-asl-demo-video
          controls
          playsinline
          crossorigin="anonymous"
        >
          <track
            id="asl-demo-track"
            kind="captions"
            srclang="en"
            label="English"
            default
          />
        </video>
        <p id="demo-caption" class="burned-caption" aria-live="polite"></p>
      </section>

      <aside class="assist" aria-label="ASL assist chrome">
        <div class="assist-top">
          <strong id="assist-badge">ASL assist</strong>
          <label class="toggle">
            <input id="assist-toggle" type="checkbox" />
            <span>Assist on</span>
          </label>
        </div>
        <p id="assist-honesty" class="honesty"></p>
        <p id="assist-chip" class="chip"></p>
        <p id="assist-gloss" class="gloss">Assist off</p>
        <p id="assist-cue" class="cue"></p>
        <p id="assist-floor" class="floor"></p>
      </aside>

      <label class="picker">
        <span>Demo clip</span>
        <select id="demo-select"></select>
      </label>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
